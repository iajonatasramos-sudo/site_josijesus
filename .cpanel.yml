---
# Deploy automático do cPanel (Git Version Control > Pull or Deploy > Deploy HEAD Commit)
# DEPLOYPATH deve ser o "Document Root" do domínio josijesus.com.br (confira em cPanel > Domains).
deployment:
  tasks:
    - export DEPLOYPATH=/home/elitedoc/josijesus.com.br
    - /bin/mkdir -p $DEPLOYPATH/assets/img $DEPLOYPATH/Livros/Capa
    - /bin/cp index.html checkout.html $DEPLOYPATH/
    - /bin/cp -R assets/img/. $DEPLOYPATH/assets/img/
    - /bin/cp -R Livros/Capa/. $DEPLOYPATH/Livros/Capa/
